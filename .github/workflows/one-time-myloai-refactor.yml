name: One-time MyLoAI identity refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[myloai-refactor-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor active identity
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ("locallama_gui", "myloai_control_center"),
              ("locallama-gui", "myloai"),
              ("LocalLama Control Center", "MyLoAI Control Center"),
              ("LocalLama", "MyLoAI"),
          )

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for raw in files:
              if not raw:
                  continue
              path = Path(raw)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace(
              '[project.scripts]\nmyloai = "myloai_control_center.app:main"\nmyloai = "myloai_control_center.app:main"\n',
              '[project.scripts]\nmyloai = "myloai_control_center.app:main"\n',
          )
          pyproject.write_text(text, encoding="utf-8")

          for path in (Path("run-locallama"), Path("run-myloai")):
              if path.exists():
                  path.unlink()
          diagrams = Path("diagrams")
          if diagrams.exists():
              import shutil
              shutil.rmtree(diagrams)

          archive_lint = Path(".github/workflows/archive-lint.yml")
          if archive_lint.exists():
              archive_lint.unlink()
          PY

          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ("locallama_gui", "myloai_control_center"),
              ("locallama-gui", "myloai"),
              ("LocalLama", "MyLoAI"),
          )

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for raw in sorted((p for p in paths if p), key=lambda p: (p.count("/"), p), reverse=True):
              old = Path(raw)
              new_name = raw
              for needle, replacement in replacements:
                  new_name = new_name.replace(needle, replacement)
              new = Path(new_name)
              if new != old and old.exists() and not new.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  old.rename(new)
          PY

          test -d myloai_control_center
          test ! -d locallama_gui

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes remain."
            exit 0
          fi
          git commit -m "refactor: complete MyLoAI identity consolidation [myloai-refactor-complete]"
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -f .github/workflows/one-time-myloai-refactor.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/one-time-myloai-refactor.yml
            git commit -m "chore: remove one-time migration workflow [myloai-refactor-complete]"
            git push origin HEAD:main
          fi
