[project]
name = "myloai"
description = "MyLoAI Control Center: a production-grade PySide6 desktop control center for local and remote LLMs."

[version]
initial = "1.2.12"
source = { type = "toml", file = "pyproject.toml", key = "project.version" }

[git]
tag_prefix = "v"
baseline = "0023c55c70d809a3ea9e5bdd97f08f185668111a"
require_clean = true
unknown_commit = "ignore"
merge_commits = "ignore"

[commits]
breaking_changes = true
ignored_types = ["docs", "style", "refactor", "test", "build", "ci", "chore"]
unknown = "ignore"

[commits.types]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[sync]
targets = [{ type = "text", file = "VERSION" }, { type = "yaml", file = "packaging/myloai-package.yaml", key = "control.Version" }, { type = "shell", file = "packaging/linux/PKGBUILD", key = "pkgver" }]

